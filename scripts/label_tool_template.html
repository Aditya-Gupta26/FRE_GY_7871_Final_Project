<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Gold Labelling Tool</title>
<!-- Built by scripts/06d_human_label_tool.py from scripts/label_tool_template.html. Works offline, no network. -->
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#1b1c1f; --ink2:#4f535a; --muted:#868a91; --line:#dfddd7;
  --accent:#2f5fd0; --accent-ink:#ffffff; --accent-soft:#e7edfb;
  --warn:#b0441b; --warn-soft:#fbebe3; --ok:#0b7a56; --ok-soft:#e2f3ec; --flag:#9a6200; --flag-soft:#fbf0d9;
  --diff:#fff5d9; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121316; --panel:#1b1d21; --ink:#ebecee; --ink2:#b3b6bc; --muted:#7f838a; --line:#30333a;
    --accent:#6a8ff0; --accent-ink:#0c1020; --accent-soft:#222b42;
    --warn:#f08c62; --warn-soft:#3a2219; --ok:#45c493; --ok-soft:#163028; --flag:#e5ab45; --flag-soft:#3a2f17;
    --diff:#342e1c; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
kbd{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;margin-left:6px;color:var(--muted);background:var(--bg)}
.bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px}
.brand{font-weight:650}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.prog{display:flex;align-items:center;gap:10px;flex:1;min-width:220px}
.track{position:relative;flex:1;height:8px;border-radius:99px;background:var(--line);overflow:visible}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2)}
.mark span{position:absolute;top:14px;left:-14px;font-size:10px;color:var(--muted)}
.prog .count{font-size:13px;color:var(--ink2);white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 120px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:920px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.sticky{position:sticky;top:76px;align-self:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.item{padding:18px 20px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px}
.text{font-size:19px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.flagbtn.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.form{padding:6px 18px 12px}
.field{padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field.miss .fname{color:var(--warn)}
.field.miss{box-shadow:inset 3px 0 0 var(--warn);padding-left:10px;margin-left:-10px}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fname{font-weight:620;font-size:14px}
.q{border:1px solid var(--line);background:transparent;border-radius:99px;width:22px;height:22px;font-size:12px;line-height:18px;padding:0;color:var(--muted)}
.help{display:none;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:8px 10px;margin:-2px 0 10px}
.field.showhelp .help{display:block}
.opts,.chips{display:flex;flex-wrap:wrap;gap:6px}
.opt,.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;font-size:14px}
.chip{border-radius:99px;padding:4px 11px;font-size:13px}
.opt:hover:not(:disabled),.chip:hover:not(:disabled){border-color:var(--accent)}
.opt.on,.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.on kbd{color:var(--accent-ink);border-color:transparent;background:transparent}
.dim{opacity:.5}
.claim{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.claim select,.claim input[type=text]{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 7px}
.claim input[type=text]{width:90px}
.claim label{font-size:13px;color:var(--ink2);display:flex;gap:4px;align-items:center}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
textarea{width:100%;min-height:44px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;resize:vertical}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px}
.foot .in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{flex:1;min-width:200px;font-size:13px;color:var(--ink2)}
.status.bad{color:var(--warn)}
.status.good{color:var(--ok)}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;justify-content:center;align-items:flex-start;padding:5vh 12px}
.sheet{background:var(--panel);border-radius:12px;max-width:860px;width:100%;max-height:90vh;overflow:auto;padding:20px 24px;box-shadow:var(--shadow)}
.sheet h2{margin-top:0}
.guide table{border-collapse:collapse;font-size:13px;margin:8px 0}
.guide td,.guide th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.guide code{font-size:12.5px;background:var(--bg);padding:1px 4px;border-radius:4px}
.guide pre{background:var(--bg);padding:8px;border-radius:6px;overflow:auto}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin-top:10px}
.cell{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:11px;padding:5px 0;text-align:center}
.cell.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cell.flag{box-shadow:inset 0 -3px 0 var(--flag)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:min(640px,92vw);font-size:14px;box-shadow:var(--shadow)}
.start h1{font-size:28px;margin:8px 0 4px}
.lede{color:var(--ink2);max-width:760px}
.rules{max-width:820px;padding-left:20px}
.rules li{margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
.card{padding:16px}
.card h3{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 12px;color:var(--ink2);font-size:13px}
.card .btn{display:block;width:100%;text-align:left;margin-top:6px}
.card .btn small{float:right;color:var(--muted)}
.btn.primary small{color:var(--accent-ink);opacity:.8}
.warnbox{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0}
.adjtable{width:100%;border-collapse:collapse;font-size:14px}
.adjtable th,.adjtable td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.adjtable th{font-size:12px;color:var(--muted);font-weight:600}
.adjtable tr.d td{background:var(--diff)}
.adjtable td.fn{font-weight:600;white-space:nowrap}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;margin-left:4px;background:var(--ink2);color:var(--panel)}
.opt.on .badge{background:var(--accent-ink);color:var(--accent)}
.agree{border-collapse:collapse;font-size:13px}
.agree td,.agree th{padding:3px 12px 3px 0;text-align:left}
.loadrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0}
.loadrow label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.muted{color:var(--muted)}
.small{font-size:13px}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
const D = /*__DATA__*/null;

const TOPICS = ["layoffs","hiring","prices_high","inflation_up","inflation_down","growth","recession","rates","tariffs","housing","markets","income","other"];
const TOPIC_HELP = {
  layoffs:"job losses, layoffs, firings, rising unemployment, weak hiring, jobless claims up",
  hiring:"job gains, hiring, falling unemployment, strong labour market",
  prices_high:"high or rising prices, cost of living, affordability squeeze, expensive groceries, gas or rent (the price level as a burden)",
  inflation_up:"the inflation rate rising, accelerating, or coming in hotter than before or than expected",
  inflation_down:"the inflation rate slowing or cooling, or prices easing or falling",
  growth:"economic growth, strong economy, GDP up, strong spending, boom",
  recession:"recession, slowdown, contraction, recession risk or warnings, GDP down",
  rates:"interest rates, the Fed, mortgage or loan rates, borrowing costs",
  tariffs:"tariffs, trade war, import taxes",
  housing:"home prices, rents, the housing market",
  markets:"stock market, investing, 401(k) values",
  income:"wages, pay, paychecks, household income, real wages",
  other:"any other economic topic (taxes, debt, deficit, shutdown effects, benefits)"
};
const INDICATORS = ["unemployment_rate","inflation","gdp_growth","payrolls"];
const IND_NAME = {unemployment_rate:"unemployment rate (%)", inflation:"inflation (%)", gdp_growth:"real GDP growth (%)", payrolls:"payrolls (thousands of jobs)"};
const MEASURES_INF = ["CPI","PCE","core CPI","core PCE","unspecified"];
const FIELDS = ["relevant","tone","emotional","frame_price","frame_unit","frame_time","attr_target","attr_dir"];
const ROWS = ["relevant","tone","emotional","topics","frame_price","frame_unit","frame_time","claims","attr_target","attr_dir"];
const OPTS = {
  relevant:[["yes","Yes","Y"],["no","No","N"]],
  tone:[["negative","Negative","1"],["neutral","Neutral","2"],["positive","Positive","3"]],
  emotional:[[0,"No",""],[1,"Yes","E"]],
  frame_price:[["level","Price level",""],["rate","Inflation rate",""],["none","None",""]],
  frame_unit:[["household","Household",""],["aggregate","Aggregate",""],["none","None",""]],
  frame_time:[["current","Current",""],["forecast","Forecast",""],["none","None",""]],
  attr_target:[["president","President",""],["fed","Fed",""],["congress","Congress",""],["democrats","Democrats",""],["republicans","Republicans",""],["business","Business",""],["foreign_trade","Foreign / trade",""],["none","Nobody",""]],
  attr_dir:[["credit","Credit",""],["blame","Blame",""],["none","None",""]]
};
const NAMES = {relevant:"Relevant", tone:"Tone", emotional:"Emotional wording", topics:"Topics", frame_price:"Price frame",
  frame_unit:"Unit frame", frame_time:"Time frame", claims:"Numerical claims", attr_target:"Credited or blamed: who", attr_dir:"Credit or blame"};
const HELP = {
  relevant:"Yes if the item is about US economic conditions: prices and inflation, jobs and unemployment, wages and incomes, growth and recession, interest rates and the Fed, housing costs, tariffs and trade as they affect the US economy, household finances, or the stock market as an economic signal. No for product deals, shopping advice and ads; a single company's news with no wider economic point; sports and celebrity items; foreign economies only; personal-finance questions with no economic condition in them (\"Roth or traditional IRA?\"); clearly off-topic items. If No, every other field is set to its none value for you.",
  tone:"How does the text describe the economy or the economic situation it is about? Negative: worse conditions, losses, hardship, risk, rising costs, falling jobs, warnings. Positive: better conditions, gains, relief, strength. Neutral: factual with no clear direction, a mixed picture where neither side dominates, or a question or explainer. Judge the economic content, not the mood of the people quoted. For a mixed item pick the side the text emphasises (\"Inflation falls to 2.9%, but families still feel squeezed\" is negative).",
  emotional:"Yes if the wording adds alarm, drama or hype beyond the facts: soar, skyrocket, plunge, crash, brutal, crisis, nightmare, devastating, slams, pain, bloodbath, boom, stunning, !!!, all caps. No for plain factual wording, even when the fact itself is bad (\"Unemployment rises to 4.5%\").",
  topics:"Tick every topic the text is about (at least one when relevant; use other for any other economic topic). Hover a topic for its definition, or open the guide.",
  frame_price:"Only for items about prices; otherwise None. Price level: the text stresses how high prices or costs are, or what things cost now vs before (cost of living, affordability, $5 eggs, prices 25% higher than in 2020). Inflation rate: the speed of price change (inflation rose to 3.4%, prices up 0.3% in May, inflation cooled). If both appear, pick the one stressed more. If prices are mentioned with neither emphasis, pick Price level.",
  frame_unit:"Household: families, consumers, workers or a person's own situation (families struggle, what it means for your wallet, I got laid off). Aggregate: national statistics or the economy as a whole (GDP grew 2.1%, economy added 150,000 jobs). None: neither.",
  frame_time:"Current: present conditions or data already released. Forecast: about the future (predictions, expectations, warnings, could, will, is expected to, economists warn of, outlook). None: neither (a pure explainer or question).",
  claims:"List every number the text states as a fact about one of four US statistics: the unemployment rate (%), inflation (%; pick CPI, PCE, core CPI, core PCE or unspecified), real GDP growth (%), payrolls (jobs added or lost in a month, in thousands: \"added 150,000 jobs\" is 150, \"lost 20,000 jobs\" is -20). Tick forecast if the number is a forecast or expectation. Ignore prices of goods, stock indexes, mortgage rates, state or foreign statistics. Most items have no claims.",
  attr:"Does the text give credit or blame for an economic condition to someone? Mentioning an actor is not enough; the text must link the actor to the condition (\"Biden touts jobs numbers\" is president, credit; \"Trump's tariffs blamed as prices rise\" is president, blame). If several are named, pick the one credited or blamed most directly. Criticism is not bias: you only record who is credited or blamed, not whether that is fair."
};

/* ---------------------------------------------------------------- utilities */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(3)){
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
let storageOK = (() => { try { localStorage.setItem("goldtool:probe","1"); localStorage.removeItem("goldtool:probe"); return true; } catch(e){ return false; } })();
const LS = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ storageOK = false; return false; } }
};
const r6 = x => Math.round(x * 1e6) / 1e6;
function numbers(text){            // same rule as src/coded.py _numbers: a claim must be a number written in the text
  const t = text.replace(/,/g, "");
  const out = new Set();
  const re = /(?<![\w.])-?\d+(?:\.\d+)?/g;
  let m;
  while ((m = re.exec(t))){
    const x = Math.abs(parseFloat(m[0]));
    const tail = t.slice(m.index + m[0].length, m.index + m[0].length + 10).toLowerCase().trim();
    out.add(r6(x)); out.add(r6(x / 1000));
    if (tail.startsWith("million") || tail.startsWith("m ")) out.add(r6(x * 1000));
  }
  return out;
}
function fnv(s){ let h1 = 0x811c9dc5; for (let i = 0; i < s.length; i++){ h1 ^= s.charCodeAt(i); h1 = Math.imul(h1, 0x01000193) >>> 0; } return h1 >>> 0; }
function stamp(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = h("a", {href:url, download:name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
let toastTimer = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = h("div", {class:"toast", role:"status"}, msg);
  document.body.append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 6500);
}
function readFile(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result)); fr.onerror = () => rej(fr.error); fr.readAsText(file); }); }
function parseJsonl(txt){
  const rows = [];
  txt.split(/\r?\n/).forEach((line, i) => { line = line.trim(); if (!line) return;
    try { rows.push(JSON.parse(line)); } catch(e){ throw new Error(`line ${i+1} is not valid JSON`); } });
  return rows;
}
const sameSet = (a, b) => { const x = [...new Set(a||[])].sort().join("|"), y = [...new Set(b||[])].sort().join("|"); return x === y; };
const claimKey = cl => (cl||[]).map(c => `${c.indicator}:${r6(Number(c.value))}`).sort().join("|");
const fmtTopics = t => (t && t.length) ? t.join(", ") : "none";
const fmtClaims = cl => (cl && cl.length) ? cl.map(c => `${c.indicator} ${c.value}${c.indicator==="inflation" ? " ("+c.measure+")" : ""}${c.forecast ? ", forecast" : ""}`).join("; ") : "none";
function nofill(){ return {tone:"neutral", emotional:0, topics:[], frame_price:"none", frame_unit:"none", frame_time:"none", claims:[], attr_target:"none", attr_dir:"none"}; }
function blank(){ return {relevant:null, tone:null, emotional:0, topics:[], frame_price:null, frame_unit:null, frame_time:null, claims:[], attr_target:null, attr_dir:null}; }

/* ---------------------------------------------------------------- state */
// Review mode: the build embeds each pass's model labels (D.prelabels); the reviewer checks every item and
// corrects what they disagree with. Without prelabels the tool is the plain two-annotator labeller.
const REVIEW = !!D.prelabels;
const NS = REVIEW ? "goldtool:v1:review" : "goldtool:v1";
const SKEY = `${NS}:session`;
let session = Object.assign({view:"start"}, LS.get(SKEY) || {});
let W = null, attempted = false, visit = null;
const wkey = (role, set) => `${NS}:${role}:${set}`;
function loadWork(role, set){ return Object.assign({labels:{}, secs:{}, notes:{}, flags:{}, reviewed:{}, pos:0, exported:0, exportedAt:null}, LS.get(wkey(role, set)) || {}); }
function saveWork(){ if (W && session.role && session.set) LS.set(wkey(session.role, session.set), W); }
function saveSession(){ LS.set(SKEY, session); }
const items = () => D.sets[session.set];
const cur = () => items()[W.pos];

function problems(l, text){
  if (!l || l.relevant == null) return ["relevant"];
  if (l.relevant === "no") return [];
  const p = [];
  if (l.tone == null) p.push("tone");
  if (!l.topics.length) p.push("at least one topic");
  for (const f of ["frame_price","frame_unit","frame_time"]) if (l[f] == null) p.push(NAMES[f].toLowerCase());
  if (l.attr_target == null) p.push("who is credited or blamed (or nobody)");
  else if (l.attr_target !== "none" && !["credit","blame"].includes(l.attr_dir)) p.push("credit or blame");
  const nums = numbers(text);
  l.claims.forEach((c, i) => {
    const n = i + 1, v = Number(c.value);
    if (!c.indicator) p.push(`claim ${n}: which statistic`);
    if (c.value === "" || c.value == null || !Number.isFinite(v)) p.push(`claim ${n}: value must be a plain number`);
    else if (!nums.has(r6(Math.abs(v)))) p.push(`claim ${n}: ${c.value} is not written in the text (enter it as stated; 150,000 jobs is 150)`);
    if (c.indicator === "inflation" && !MEASURES_INF.includes(c.measure)) p.push(`claim ${n}: measure`);
  });
  return p;
}
function status(it, w = W, role = session.role){
  const l = w.labels[it.id];
  if (REVIEW){
    if (w.reviewed[it.id] && l && problems(l, it.text).length === 0) return "done";
    return l && changedFields(it.id, l, role).length ? "part" : "todo";
  }
  if (!l || l.relevant == null) return "todo";
  return problems(l, it.text).length ? "part" : "done";
}
function outRow(id, l, extra){
  const o = l.relevant === "no" ? Object.assign({item_id:id, relevant:"no"}, nofill()) : {
    item_id:id, relevant:"yes", tone:l.tone, emotional:l.emotional ? 1 : 0,
    topics:TOPICS.filter(t => l.topics.includes(t)),
    frame_price:l.frame_price, frame_unit:l.frame_unit, frame_time:l.frame_time,
    claims:l.claims.map(c => ({indicator:c.indicator, value:Number(c.value),
      measure:c.indicator === "inflation" ? c.measure : "na", forecast:c.forecast ? 1 : 0})),
    attr_target:l.attr_target, attr_dir:l.attr_target === "none" ? "none" : l.attr_dir};
  return Object.assign(o, extra || {});
}
function fromRow(r){                              // an exported / model JSONL row -> the editable label object
  return {relevant:r.relevant, tone:r.tone, emotional:r.emotional ? 1 : 0, topics:[...(r.topics || [])],
    frame_price:r.frame_price, frame_unit:r.frame_unit, frame_time:r.frame_time,
    claims:(r.claims || []).map(c => ({indicator:c.indicator, value:String(c.value), measure:c.indicator === "inflation" ? c.measure : "na", forecast:c.forecast ? 1 : 0})),
    attr_target:r.attr_target, attr_dir:r.attr_dir};
}
const prelabel = (id, role = session.role) => REVIEW && D.prelabels[role] ? D.prelabels[role][id] : null;
function changedFields(id, l, role = session.role){ // fields where the reviewer's label differs from the model's
  const pre = prelabel(id, role);
  if (!pre || !l || l.relevant == null) return [];
  const a = outRow(id, fromRow(pre)), b = outRow(id, l);

function endVisit(){

  W.secs[visit.id] = (W.secs[visit.id] || 0) + s;
  visit = null; saveWork();
}

document.addEventListener("keydown", e => {
  if (session.view !== "label" || !W || document.querySelector(".overlay")){
    if (e.key === "Escape") document.querySelectorAll(".overlay").forEach(o => o.remove());
    return;
  }
  const tag = (e.target.tagName || "").toLowerCase();
  if (["input","textarea","select"].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  const id = cur().id, l = W.labels[id], k = e.key.toLowerCase();
  const act = fn => { e.preventDefault(); fn(); };
  if (k === "y") act(() => setField(id, "relevant", "yes"));
  else if (k === "n") act(() => setField(id, "relevant", "no"));
  else if (["1","2","3"].includes(k) && l.relevant === "yes") act(() => setField(id, "tone", ["negative","neutral","positive"][+k - 1]));
  else if (k === "e" && l.relevant === "yes") act(() => setField(id, "emotional", l.emotional ? 0 : 1));

/* ---------- export, backup, restore */
function exportLabels(){
  endVisit(); startVisit();
  const its = items(), lines = [];
  for (const it of its){
    const l = W.labels[it.id];
    if (REVIEW ? status(it) === "done" : l && l.relevant != null && !problems(l, it.text).length){
      const extra = {};
      if (REVIEW){ extra.reviewed = 1; extra.changed = changedFields(it.id, l); }
      if ((W.notes[it.id] || "").trim()) extra.note = W.notes[it.id].trim();
      if (W.flags[it.id]) extra.flag = 1;
      extra.secs = Math.round(W.secs[it.id] || 0);
      lines.push(JSON.stringify(outRow(it.id, l, extra)));
    }
  }
  if (!lines.length){ toast("Nothing to export yet: no item is complete."); return; }
  const name = REVIEW ? `human_verified_${session.role}.jsonl` : `human_${session.set === "gold" ? "labels" : "practice"}_${session.role}.jsonl`;
  download(name, lines.join("\n") + "\n", "application/x-ndjson");
  W.exported = lines.length; W.exportedAt = new Date().toISOString(); saveWork();
  const left = its.length - lines.length;
  toast(`Saved ${lines.length} labels as ${name} (check Downloads).${left ? ` ${left} unfinished items were left out.` : ""}`);
}

      } else {
        const b = JSON.parse(txt);
        if (b.tool !== "goldtool" || !b.work) throw new Error("not a backup from this tool");
        if ((b.role !== session.role || b.set !== session.set) &&
            !confirm(`This backup is Annotator ${b.role}, ${b.set}; you are in Annotator ${session.role}, ${session.set}. Load it here anyway?`)) return;
        if (!confirm(`Replace the current progress with the backup saved ${b.saved}?`)) return;
        work = Object.assign(loadWork("__none__", "__none__"), b.work);
      }
      W = work; saveWork(); visit = null; renderLabel();
      toast("Restored.");
    } catch(err){ toast(`Could not load ${f.name}: ${err.message}`); }
  });
  inp.click();
}

/* ---------------------------------------------------------------- compare and adjudicate */
let ADJ = null;
function renderAdjLoad(){
  session.view = "adjudicate"; saveSession();
  if (ADJ){ renderAdj(); return; }
  const files = [null, null];
  const go2 = h("button", {class:"btn primary", disabled:true, onclick:async () => {
    try { ADJ = buildAdj(files[0], files[1]); renderAdj(); } catch(err){ toast(err.message); }
  }}, "Compare");
  const ex = REVIEW ? ["human_verified_A.jsonl", "human_verified_B.jsonl"] : ["human_labels_A.jsonl", "human_labels_B.jsonl"];
  const pick = i => h("label", null, `File ${i + 1} (${ex[i]})`,
    h("input", {type:"file", accept:".jsonl", onchange:async e => {
      const f = e.target.files[0]; if (!f) return;
      try { const raw = await readFile(f); files[i] = {name:f.name, raw, rows:parseJsonl(raw)}; }
      catch(err){ files[i] = null; toast(`${f.name}: ${err.message}`); }
      go2.disabled = !(files[0] && files[1]);
    }}));
  app.replaceChildren(
    h("div", {class:"bar"}, h("div", {class:"brand"}, "Compare and adjudicate"), h("div", {class:"prog"}),
      h("div", {class:"nav"}, h("button", {class:"btn", onclick:showGuide}, "Guide"),
        h("button", {class:"btn ghost", onclick:() => { session.view = "start"; saveSession(); render(); }}, "Home"))),
    h("div", {class:"wrap"},
      h("div", {class:"panel item"},
        h("h2", {style:"margin-top:0"}, "Load the two export files"),
        h("p", {class:"small"}, (REVIEW ? "Load your two reviewed passes. " : "Works for the practice files (to discuss the guide) and for the gold files (to adjudicate). ") +
          "For each disputed item the two labels are shown as Label 1 and Label 2 in a random order, without names, so the adjudicator doesn't side with one by habit."),
        h("div", {class:"loadrow"}, pick(0), pick(1), go2))));
}
function buildAdj(f1, f2){
  const ids1 = f1.rows.map(r => r.item_id), ids2 = f2.rows.map(r => r.item_id);
  const set = (ids1[0] || "").startsWith("D") ? "practice" : "gold";
  const its = D.sets[set], tmap = new Map(its.map(x => [x.id, x.text]));
  const bad = [...ids1, ...ids2].filter(id => !tmap.has(id));
  if (bad.length) throw new Error(`Unknown item ids (${bad.slice(0, 3).join(", ")}): both files must be exports of the same set.`);
  if (f1.raw === f2.raw) throw new Error("The two files are identical: load A's file and B's file.");
  const m1 = new Map(f1.rows.map(r => [r.item_id, r])), m2 = new Map(f2.rows.map(r => [r.item_id, r]));
  const common = its.map(x => x.id).filter(id => m1.has(id) && m2.has(id));
  const agree = {};
  for (const f of FIELDS) agree[f] = common.filter(id => String(m1.get(id)[f]) === String(m2.get(id)[f])).length;
  agree.topics = common.filter(id => sameSet(m1.get(id).topics, m2.get(id).topics)).length;
  agree.claims = common.filter(id => claimKey(m1.get(id).claims) === claimKey(m2.get(id).claims)).length;
  const diffs = common.filter(id => FIELDS.some(f => String(m1.get(id)[f]) !== String(m2.get(id)[f]))
    || !sameSet(m1.get(id).topics, m2.get(id).topics) || claimKey(m1.get(id).claims) !== claimKey(m2.get(id).claims));
  const pair = [fnv(f1.raw), fnv(f2.raw)].sort((a, b) => a - b).join(":");
  const key = `goldtool:v1:adj:${set}:${pair}`;
  const saved = Object.assign({final:{}, notes:{}, idx:0}, LS.get(key) || {});
  return {set, f1, f2, m1, m2, tmap, common, agree, diffs, key, saved};
}
function adjLabels(id){                         // seeded, per item: which file is shown as Label 1
  const swap = fnv(id + "|adjudicate") % 2 === 1;
  return swap ? [ADJ.m2.get(id), ADJ.m1.get(id)] : [ADJ.m1.get(id), ADJ.m2.get(id)];
}
function initFinal(a, b){
  if (a.relevant !== b.relevant) return {relevant:null};
  if (a.relevant === "no") return Object.assign({relevant:"no"}, nofill());
  const f = {relevant:"yes"};
  for (const k of ["tone","emotional","frame_price","frame_unit","frame_time","attr_target","attr_dir"]) f[k] = String(a[k]) === String(b[k]) ? a[k] : null;
  f.topics = sameSet(a.topics, b.topics) ? [...a.topics] : null;
  f.claims = claimKey(a.claims) === claimKey(b.claims) ? JSON.parse(JSON.stringify(a.claims)) : null;
  if (f.attr_target === "none") f.attr_dir = "none";
  return f;
}
function adjProblems(f){
  if (!f || f.relevant == null) return ["relevant"];
  if (f.relevant === "no") return [];
  const p = [];
  for (const k of ["tone","emotional","frame_price","frame_unit","frame_time"]) if (f[k] == null) p.push(NAMES[k].toLowerCase());
  if (f.topics == null || !f.topics.length) p.push("topics");
  if (f.claims == null) p.push("claims");
  if (f.attr_target == null) p.push("who is credited or blamed");
  else if (f.attr_target !== "none" && !["credit","blame"].includes(f.attr_dir)) p.push("credit or blame");
  return p;
}
function saveAdj(){ LS.set(ADJ.key, ADJ.saved); }
function renderAdj(){
  const S = ADJ.saved, n = ADJ.diffs.length, N = ADJ.common.length;
  const doneN = ADJ.diffs.filter(id => S.final[id] && !adjProblems(S.final[id]).length).length;
  const pct = k => N ? `${(100 * k / N).toFixed(1)}%` : "n/a";
  const header = h("div", {class:"bar"},
    h("div", {class:"brand"}, "Compare and adjudicate", h("small", null, ADJ.set === "gold" ? "Gold set" : "Practice")),
    h("div", {class:"prog"}, h("div", {class:"track"}, h("div", {class:"fill", style:`width:${n ? 100 * doneN / n : 100}%`})),
      h("span", {class:"count"}, `${doneN} of ${n} disputed items settled`)),
    h("div", {class:"nav"}, h("button", {class:"btn", onclick:showGuide}, "Guide"),
      h("button", {class:"btn primary", onclick:exportAdj, disabled:!n || null}, "Export"),
      h("button", {class:"btn ghost", onclick:() => { ADJ = null; session.view = "start"; saveSession(); render(); }}, "Home")));
  const summary = h("div", {class:"panel item"},
    h("div", {class:"small"}, `${ADJ.f1.name} (${ADJ.f1.rows.length} items) and ${ADJ.f2.name} (${ADJ.f2.rows.length} items): `,
      h("b", null, `${N} items labelled by both, ${n} with any difference.`),
      N < ADJ.tmap.size ? h("span", {class:"muted"}, ` ${ADJ.tmap.size - N} items are not in both files yet.`) : null),
    h("details", {style:"margin-top:8px"}, h("summary", {class:"small"}, "Raw agreement by field (kappa comes from the analysis script)"),
      h("table", {class:"agree"}, h("tr", null, h("th", null, "field"), h("th", null, "same label")),
        ROWS.map(f => h("tr", null, h("td", null, NAMES[f]), h("td", null, pct(ADJ.agree[f])))))));
  if (!n){ app.replaceChildren(header, h("div", {class:"wrap"}, summary, h("p", null, "The two files agree on every item they share."))); return; }
  if (S.idx >= n) S.idx = n - 1;
  const id = ADJ.diffs[S.idx];
  const [L1, L2] = adjLabels(id);
  if (!S.final[id]) S.final[id] = initFinal(L1, L2);
  const F = S.final[id];
  const relDisputed = L1.relevant !== L2.relevant;
  const fmt = (k, r) => k === "topics" ? fmtTopics(r.topics) : k === "claims" ? fmtClaims(r.claims) : String(r[k]);
  const differs = k => k === "topics" ? !sameSet(L1.topics, L2.topics) : k === "claims" ? claimKey(L1.claims) !== claimKey(L2.claims) : String(L1[k]) !== String(L2[k]);
  const editable = k => k === "relevant" ? relDisputed
    : F.relevant === "yes" && (relDisputed || differs(k) || (k === "attr_dir" && differs("attr_target")));
  const setF = (k, v) => {
    if (k === "relevant"){
      if (v === "no") Object.assign(F, nofill());
      else if (relDisputed){ const yes = L1.relevant === "yes" ? L1 : L2;
        Object.assign(F, JSON.parse(JSON.stringify({tone:yes.tone, emotional:yes.emotional, topics:yes.topics, frame_price:yes.frame_price, frame_unit:yes.frame_unit,
          frame_time:yes.frame_time, claims:yes.claims, attr_target:yes.attr_target, attr_dir:yes.attr_dir}))); }
      F.relevant = v;
    } else if (k === "attr_target"){
      F.attr_target = v;
      const same = [L1, L2].filter(r => r.attr_target === v).map(r => r.attr_dir);
      F.attr_dir = v === "none" ? "none" : (same.length && same.every(d => d === same[0]) ? same[0] : null);
    } else F[k] = v;
    saveAdj(); renderAdj();
  };
  const badge = (k, v) => [String(L1[k]) === String(v) ? h("span", {class:"badge"}, "1") : null, String(L2[k]) === String(v) ? h("span", {class:"badge"}, "2") : null];
  const finalCell = k => {
    if (k !== "relevant" && F.relevant === "no") return h("span", {class:"muted"}, "none (not relevant)");
    if (k !== "relevant" && F.relevant == null) return h("span", {class:"muted"}, "decide relevance first");
    if (!editable(k)) return h("span", {class:"muted"}, k === "topics" ? fmtTopics(F.topics) : k === "claims" ? fmtClaims(F.claims) : `${F[k]} (agreed)`);
    if (k === "topics") return h("div", null,
      h("div", {class:"opts", style:"margin-bottom:6px"},
        h("button", {class:"opt", onclick:() => setF("topics", [...L1.topics])}, "Label 1's"),
        h("button", {class:"opt", onclick:() => setF("topics", [...L2.topics])}, "Label 2's"),
        h("button", {class:"opt", onclick:() => setF("topics", TOPICS.filter(t => L1.topics.includes(t) || L2.topics.includes(t)))}, "Both")),
      h("div", {class:"chips"}, TOPICS.map(t => { const on = (F.topics || []).includes(t);
        return h("button", {class:"chip" + (on ? " on" : ""), title:TOPIC_HELP[t], onclick:() => {
          const cur2 = [...(F.topics || [])]; const i = cur2.indexOf(t); if (i >= 0) cur2.splice(i, 1); else cur2.push(t); setF("topics", TOPICS.filter(x => cur2.includes(x))); }},
          t.replace("_", " "), L1.topics.includes(t) ? h("span", {class:"badge"}, "1") : null, L2.topics.includes(t) ? h("span", {class:"badge"}, "2") : null); })));
    if (k === "claims") return h("div", {class:"opts"},
      [L1, L2].map((r, i) => h("button", {class:"opt" + (F.claims != null && claimKey(F.claims) === claimKey(r.claims) ? " on" : ""),
        onclick:() => setF("claims", JSON.parse(JSON.stringify(r.claims || [])))}, `Label ${i + 1}'s: ${fmtClaims(r.claims)}`)));
    let opts = OPTS[k];
    if (k === "attr_dir"){ if (F.attr_target == null) return h("span", {class:"muted"}, "pick who first"); if (F.attr_target === "none") return h("span", {class:"muted"}, "none"); opts = opts.filter(o => o[0] !== "none"); }
    return h("div", {class:"opts"}, opts.map(([v, label]) => h("button", {class:"opt" + (String(F[k]) === String(v) ? " on" : ""), onclick:() => setF(k, v)}, label, badge(k, v))));
  };
  const table = h("table", {class:"adjtable"},
    h("tr", null, h("th", null, "Field"), h("th", null, "Label 1"), h("th", null, "Label 2"), h("th", null, "Final")),
    ROWS.map(k => h("tr", {class:differs(k) ? "d" : ""}, h("td", {class:"fn"}, NAMES[k]), h("td", null, fmt(k, L1)), h("td", null, fmt(k, L2)), h("td", null, finalCell(k)))));
  const notes = [L1.note, L2.note].map((t, i) => t ? h("div", {class:"small muted"}, `Label ${i + 1} note: ${t}`) : null);
  const p = adjProblems(F);
  app.replaceChildren(header, h("div", {class:"wrap"}, summary,
    h("div", {class:"panel item", style:"margin-top:14px"},
      h("div", {class:"meta"}, h("span", null, `Disputed item ${S.idx + 1} of ${n}`, h("span", {class:"muted"}, `  ·  ${id}`))),
      h("div", {class:"text"}, ADJ.tmap.get(id)), notes,
      relDisputed && F.relevant === "yes" ? h("p", {class:"small muted"}, "The other label said not relevant, so its other fields were placeholders: the final starts from the relevant label's values. Change any you disagree with.") : null),
    h("div", {class:"panel item", style:"margin-top:14px;overflow-x:auto"}, table,
      h("div", {style:"margin-top:12px"}, h("div", {class:"fname", style:"font-size:13px;margin-bottom:4px"}, "Reason (optional)"),
        h("textarea", {oninput:e => { S.notes[id] = e.target.value; saveAdj(); }}, S.notes[id] || "")))),
    h("div", {class:"foot"}, h("div", {class:"in"},
      h("div", {class:"status " + (p.length ? "" : "good")}, p.length ? "Still to decide: " + p.join("; ") : "Settled."),
      h("button", {class:"btn", disabled:S.idx === 0 || null, onclick:() => { S.idx--; saveAdj(); renderAdj(); window.scrollTo(0, 0); }}, "Back"),
      h("button", {class:"btn primary", disabled:S.idx >= n - 1 || null, onclick:() => { S.idx++; saveAdj(); renderAdj(); window.scrollTo(0, 0); }}, "Next"))));
}
function exportAdj(){
  const S = ADJ.saved, lines = [];
  for (const id of ADJ.diffs){
    const F = S.final[id];
    if (!F || adjProblems(F).length) continue;
    const l = F.relevant === "no" ? Object.assign({relevant:"no"}, nofill()) : F;
    const row = outRow(id, Object.assign({}, l, {claims:(l.claims || []).map(c => ({...c, value:String(c.value)}))}));
    const why = (S.notes[id] || "").trim();
    if (why) row.reason = why;
    lines.push(JSON.stringify(row));
  }
  if (!lines.length){ toast("Nothing settled yet."); return; }
  const name = ADJ.set === "gold" ? "human_adjudicated.jsonl" : "human_practice_adjudicated.jsonl";
  download(name, lines.join("\n") + "\n", "application/x-ndjson");
  const left = ADJ.diffs.length - lines.length;
  toast(`Saved ${lines.length} settled items as ${name}.${left ? ` ${left} are not settled yet and were left out.` : ""}`);
}

if (session.view === "label" && session.role && session.set) W = loadWork(session.role, session.set);
render();
</script>
